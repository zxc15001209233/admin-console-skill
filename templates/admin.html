<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>会议室预约</title>
<style>
  /* 色值：themes.md token 表。组件样式里禁止再出现裸色。 */
  html[data-theme="light"] {
    color-scheme:light;
    --bg-page:#f0f2f5; --bg-sidebar:#ffffff; --bg-topbar:#ffffff; --bg-card:#ffffff;
    --bg-input:#ffffff; --bg-muted:#f7f8fa; --bg-hover:#f6f7f9;
    --bg-overlay:rgba(15,20,25,.45);
    --color-primary:#3b5bdb; --color-primary-hover:#324db8; --color-primary-active:#2b429c;
    --color-primary-soft:#eef1fc; --ring:rgba(59,91,219,.18);
    --border:#e8eaef; --border-strong:#d8dce4;
    --text-1:#1a1d24; --text-2:#5c6570; --text-3:#8b939e;
    --text-on-sidebar:#5c6570; --text-on-sidebar-strong:#1a1d24; --text-on-primary:#ffffff;
    --bg-sidebar-hover:#f6f7f9; --bg-sidebar-active:#eef1fc; --sidebar-accent:#3b5bdb;
    --danger:#d92d20; --success:#079455; --warning:#dc6803;
    --success-soft:#edfaf3; --warning-soft:#fff6ed; --muted-soft:#f2f4f7;
    --shadow-1:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
    --shadow-2:0 12px 32px rgba(16,24,40,.12);
    --login-scrim:rgba(240,242,245,.28); --login-photo:none; --login-sky-top:#eef1fc; --login-sky-bot:#dce3f0; --login-far:#d2dae8; --login-build:#c4cde0; --login-build-2:#c0cadc; --login-build-3:#c8d2e4; --login-ground:#d4dce8; --login-street:#ccd6e4; --login-win:rgba(26,29,36,.08); --login-win-lit:transparent;
  }
  html[data-theme="dark"] {
    color-scheme:dark;
    --bg-page:#0d1117; --bg-sidebar:#141926; --bg-topbar:#171d26; --bg-card:#171d26;
    --bg-input:#11161d; --bg-muted:#1e242e; --bg-hover:#1c222b;
    --bg-overlay:rgba(0,0,0,.55);
    --color-primary:#5c7cfa; --color-primary-hover:#7189fb; --color-primary-active:#4c6ef5;
    --color-primary-soft:rgba(92,124,250,.14); --ring:rgba(92,124,250,.28);
    --border:#262d38; --border-strong:#333c4a;
    --text-1:#e8edf4; --text-2:#9aa8b5; --text-3:#6b7785;
    --text-on-sidebar:rgba(232,237,244,.72); --text-on-sidebar-strong:#eef1fb; --text-on-primary:#ffffff;
    --bg-sidebar-hover:rgba(255,255,255,.06); --bg-sidebar-active:rgba(125,148,248,.16); --sidebar-accent:#7d94f8;
    --danger:#f97066; --success:#3ccb7f; --warning:#f7b267;
    --success-soft:rgba(60,203,127,.16); --warning-soft:rgba(247,178,103,.16); --muted-soft:rgba(107,119,133,.22);
    --shadow-1:0 1px 2px rgba(0,0,0,.28);
    --shadow-2:0 12px 32px rgba(0,0,0,.36);
    --login-scrim:rgba(13,17,23,.4); --login-photo:none; --login-sky-top:#161d2a; --login-sky-bot:#10161f; --login-far:#1a2432; --login-build:#1e2838; --login-build-2:#222e40; --login-build-3:#1a2434; --login-ground:#121820; --login-street:#0f141c; --login-win:rgba(232,237,244,.04); --login-win-lit:rgba(247,178,103,.28);
  }
  :root {
    --radius:8px; --radius-sm:6px; --radius-pill:999px;
    --dur:.15s; --dur-panel:.28s; --ease:cubic-bezier(.32,.72,0,1);
    --fs-num:24px; --fs-brand:32px; --fs-page:20px; --fs-title:16px; --fs-body:13px; --fs-label:12px; --fs-micro:11px;
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px;
    --ico:18px; --ctl-h:32px; --row-h:44px;
    --sidebar-w:232px; --sidebar-w-collapsed:64px; --topbar-h:56px; --drawer-w:480px; --tree-w:240px; --ctl-sm:28px; --accent-bar:3px; --ring-w:3px; --seg-gap:2px; --modal-w:420px; --login-mark:48px; --login-wash:240px; --login-scene:.5; --login-photo-size:cover; --login-photo-repeat:no-repeat; --login-photo-pos:center; --login-ctl:36px; --empty-ico:48px; --stat-max:960px;
  }

  * { box-sizing:border-box; }
  body {
    margin:0; font:var(--fs-body)/1.5 "PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg-page); color:var(--text-1);
  }
  :focus-visible { outline:none; box-shadow:0 0 0 var(--ring-w) var(--ring); border-radius:var(--radius-sm); }
  .app { display:flex; min-height:100vh; }

  .sidebar {
    width:var(--sidebar-w); background:var(--bg-sidebar); color:var(--text-on-sidebar);
    padding:var(--sp-4) 0; flex-shrink:0; overflow:visible; z-index:2;
    box-shadow:inset -1px 0 0 var(--border);
    transition:width var(--dur-panel) var(--ease);
  }
  .sidebar.collapsed { width:var(--sidebar-w-collapsed); }
  .sidebar-head { display:flex; align-items:center; justify-content:space-between; gap:var(--sp-2); padding:0 var(--sp-3) var(--sp-5); }
  .sidebar-brand { display:flex; align-items:center; gap:var(--sp-2); min-width:0; }
  .brand-mark {
    width:var(--ctl-h); height:var(--ctl-h); flex-shrink:0; border-radius:var(--radius);
    background:var(--sidebar-accent); color:var(--text-on-primary);
    display:flex; align-items:center; justify-content:center;
    font-size:var(--fs-body); font-weight:600;
  }
  .brand-text { font-size:var(--fs-title); font-weight:600; color:var(--text-on-sidebar-strong); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sidebar.collapsed .brand-text { display:none; }
  .sidebar.collapsed .sidebar-head { flex-direction:column; justify-content:center; padding:0 0 var(--sp-3); }
  .sidebar-toggle {
    flex-shrink:0; width:var(--ctl-sm); height:var(--ctl-sm); border:0; border-radius:var(--radius-sm);
    background:transparent; color:var(--text-3); cursor:pointer; font:inherit;
    transition:background var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  .sidebar-toggle:hover { background:var(--bg-sidebar-hover); color:var(--text-on-sidebar-strong); }
  .nav-group { margin-bottom:var(--sp-1); }
  .nav-group-hd {
    display:flex; align-items:center; justify-content:space-between; width:100%;
    padding:var(--sp-2) var(--sp-4); border:0; background:transparent;
    color:var(--text-3); font-size:var(--fs-micro); font-weight:500; letter-spacing:.06em;
    cursor:pointer; text-align:left;
  }
  .nav-group-hd .chevron { transition:transform var(--dur) var(--ease); }
  .nav-group.collapsed .nav-group-hd .chevron { transform:rotate(-90deg); }
  .nav-group.collapsed .nav-group-bd { display:none; }
  .sidebar.collapsed .nav-group-hd { display:none; }
  .sidebar.collapsed .nav-group { margin:var(--sp-2) 0; padding-top:var(--sp-2); border-top:1px solid var(--border); }
  .sidebar.collapsed .nav-group.collapsed .nav-group-bd { display:block; }
  .nav-ico {
    width:var(--ico); height:var(--ico); flex-shrink:0;
    fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round;
  }
  .sidebar a {
    display:flex; align-items:center; gap:var(--sp-2); position:relative;
    margin:2px var(--sp-2); padding:var(--sp-2) var(--sp-3);
    color:var(--text-on-sidebar); text-decoration:none; border-radius:var(--radius-sm);
    transition:background var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  .sidebar a .nav-label { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sidebar a:hover { background:var(--bg-sidebar-hover); color:var(--text-on-sidebar-strong); }
  .sidebar a.active { background:var(--bg-sidebar-active); color:var(--text-on-sidebar-strong); font-weight:500; }
  .sidebar a.active::before {
    content:""; position:absolute; left:0; top:var(--sp-2); bottom:var(--sp-2);
    width:var(--accent-bar); border-radius:var(--radius-pill); background:var(--sidebar-accent);
  }
  .sidebar.collapsed a { justify-content:center; padding:var(--sp-2) 0; margin:2px var(--sp-2); }
  .sidebar.collapsed a .nav-label {
    position:absolute; left:100%; top:50%; transform:translateY(-50%);
    margin-left:var(--sp-2); padding:var(--sp-1) var(--sp-3);
    background:var(--bg-card); color:var(--text-1); box-shadow:var(--shadow-2);
    border-radius:var(--radius-sm); font-size:var(--fs-label); font-weight:500;
    opacity:0; pointer-events:none; white-space:nowrap; overflow:visible;
    transition:opacity var(--dur) var(--ease); z-index:5;
  }
  .sidebar.collapsed a:hover .nav-label,
  .sidebar.collapsed a:focus-visible .nav-label { opacity:1; }

  /* 顶栏 */
  .main { flex:1; display:flex; flex-direction:column; min-width:0; position:relative; z-index:1; }
  .topbar {
    height:var(--topbar-h); flex-shrink:0; background:var(--bg-topbar);
    display:flex; align-items:center; justify-content:space-between; gap:var(--sp-3);
    padding:0 var(--sp-6); box-shadow:inset 0 -1px 0 var(--border);
  }
  .breadcrumb { color:var(--text-2); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .breadcrumb strong { color:var(--text-1); font-weight:600; }
  .topbar-actions { display:flex; align-items:center; gap:var(--sp-3); flex-shrink:0; }
  .tabs {
    display:flex; align-items:stretch; gap:var(--sp-4);
    min-height:var(--ctl-h); flex-shrink:0;
    padding:0 var(--sp-6);
    background:var(--bg-topbar);
    box-shadow:inset 0 -1px 0 var(--border);
    overflow-x:auto;
  }
  .tabs[hidden] { display:none !important; }
  .tab {
    display:inline-flex; align-items:center; gap:var(--sp-1);
    height:var(--ctl-h); padding:0;
    border:0;
    background:transparent; color:var(--text-2);
    font-size:var(--fs-body); white-space:nowrap; flex-shrink:0;
    position:relative;
  }
  .tab:hover { color:var(--text-1); background:transparent; }
  .tab.active { color:var(--text-1); font-weight:500; background:transparent; }
  .tab.active::after {
    content:""; position:absolute; left:0; right:0; bottom:0;
    height:var(--accent-bar); background:var(--color-primary); border-radius:var(--radius-pill);
  }
  .tab-hit {
    appearance:none; border:0; background:transparent; color:inherit;
    font:inherit; font-weight:inherit; padding:0; cursor:pointer;
  }
  .tab-close {
    appearance:none; border:0; background:transparent; color:var(--text-3);
    width:var(--ctl-sm); height:var(--ctl-sm); padding:0; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
    border-radius:var(--radius-sm); font-size:var(--fs-title); line-height:1;
  }
  .tab-close:hover { color:var(--text-1); background:var(--bg-hover); }
  .tab-panes { flex:1; min-height:0; position:relative; }
  .demo-role {
    display:inline-flex; align-items:center; gap:var(--sp-1);
    height:var(--ctl-h); padding:0 var(--sp-2);
    background:var(--bg-muted); border-radius:var(--radius);
    color:var(--text-3); font-size:var(--fs-label);
  }
  .demo-role select {
    height:var(--ctl-sm); border:0; background:transparent; color:var(--text-2);
    padding:0 var(--sp-1); box-shadow:none; font-size:var(--fs-label);
  }
  .demo-role select:hover { border-color:transparent; }
  .demo-role select:focus-visible { box-shadow:0 0 0 var(--ring-w) var(--ring); }
  .theme-seg { display:flex; gap:var(--seg-gap); padding:var(--seg-gap); background:var(--bg-muted); border-radius:var(--radius); }
  .theme-seg button {
    border:0; background:transparent; color:var(--text-2); cursor:pointer; font:inherit;
    width:var(--ctl-sm); height:var(--ctl-sm); padding:0;
    display:inline-flex; align-items:center; justify-content:center;
    border-radius:var(--radius-sm);
    transition:background var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  .theme-seg .theme-ico {
    width:var(--ico); height:var(--ico);
    fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round;
  }
  .theme-seg button:hover { color:var(--text-1); }
  .theme-seg button.active { background:var(--bg-card); color:var(--text-1); box-shadow:var(--shadow-1); }
  .user-menu { position:relative; }
  .user-area {
    display:flex; align-items:center; gap:var(--sp-2); color:var(--text-2);
    border:0; background:transparent; padding:var(--sp-1) var(--sp-2); border-radius:var(--radius-sm);
    transition:background var(--dur) var(--ease);
  }
  .user-area:hover { background:var(--bg-hover); color:var(--text-1); }
  .user-dropdown {
    display:none; position:absolute; right:0; top:calc(100% + var(--sp-1)); z-index:30;
    min-width:160px; padding:var(--sp-1); background:var(--bg-card); color:var(--text-1);
    border-radius:var(--radius); box-shadow:var(--shadow-2);
  }
  .user-dropdown.open { display:block; }
  .user-drop-item {
    display:block; width:100%; border:0; background:transparent; color:var(--text-1);
    text-align:left; padding:var(--sp-2) var(--sp-3); border-radius:var(--radius-sm);
    transition:background var(--dur) var(--ease);
  }
  .user-drop-item:hover { background:var(--bg-hover); }
  .user-drop-item.danger { color:var(--danger); }
  .user-avatar {
    width:var(--ctl-sm); height:var(--ctl-sm); border-radius:50%;
    background:var(--color-primary-soft); color:var(--color-primary);
    display:flex; align-items:center; justify-content:center;
    font-size:var(--fs-label); font-weight:600;
  }

  /* 控件 */
  input, select, button { font:inherit; }
  .field {
    height:var(--ctl-h); padding:0 var(--sp-3);
    border:1px solid var(--border); border-radius:var(--radius);
    background:var(--bg-input); color:var(--text-1);
    transition:border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  }
  .field:hover { border-color:var(--border-strong); }
  .field:focus-visible { outline:none; border-color:var(--color-primary); box-shadow:0 0 0 var(--ring-w) var(--ring); }
  button { cursor:pointer; }
  .btn {
    height:var(--ctl-h); padding:0 var(--sp-4); border:0; border-radius:var(--radius);
    font-weight:500; transition:background var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  .btn.primary { background:var(--color-primary); color:var(--text-on-primary); }
  .btn.primary:hover { background:var(--color-primary-hover); }
  .btn.primary:active { background:var(--color-primary-active); }
  .btn.ghost { background:var(--bg-muted); color:var(--text-1); }
  .btn.ghost:hover { background:var(--bg-hover); }
  .btn.ghost:disabled { color:var(--text-3); cursor:not-allowed; }
  .btn-link {
    border:0; background:transparent; color:var(--color-primary);
    padding:var(--sp-1) var(--sp-1); border-radius:var(--radius-sm);
    transition:color var(--dur) var(--ease);
  }
  .btn-link:hover { color:var(--color-primary-hover); text-decoration:underline; }
  .btn-link.danger { color:var(--danger); }

  /* 内容区 */
  .content { height:100%; overflow:auto; padding:var(--sp-5) var(--sp-6); }
  .tab-pane { display:none; }
  .tab-pane.active { display:block; }
  .page-head { display:flex; align-items:center; justify-content:space-between; gap:var(--sp-3); margin-bottom:var(--sp-4); }
  .page-head h1 { margin:0; font-size:var(--fs-page); font-weight:600; }
  .page-head .actions { display:flex; gap:var(--sp-2); }
  .card { background:var(--bg-card); border-radius:var(--radius); box-shadow:var(--shadow-1); }

  /* 筛选条 */
  .filter-bar {
    display:flex; flex-wrap:wrap; align-items:center; gap:var(--sp-2);
    padding:var(--sp-3) var(--sp-4); margin-bottom:var(--sp-3);
    background:var(--bg-card); border-radius:var(--radius); box-shadow:var(--shadow-1);
  }
  .filter-bar label { display:inline-flex; align-items:center; gap:var(--sp-2); color:var(--text-2); }

  /* 表格 */
  .table-wrap { overflow:auto; max-height:calc(100vh - var(--topbar-h) - var(--sp-6) * 7); background:var(--bg-card); border-radius:var(--radius); box-shadow:var(--shadow-1); }
  table { width:100%; border-collapse:collapse; table-layout:fixed; }
  th {
    position:sticky; top:0; z-index:1; background:var(--bg-card);
    padding:var(--sp-3) var(--sp-4); text-align:left;
    color:var(--text-3); font-size:var(--fs-micro); font-weight:500; letter-spacing:.06em;
    white-space:nowrap; border-bottom:1px solid var(--border-strong);
  }
  td {
    height:var(--row-h); padding:0 var(--sp-4); text-align:left;
    border-bottom:1px solid var(--border); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  tbody tr { transition:background var(--dur) var(--ease); }
  tbody tr:hover { background:var(--bg-hover); }
  tbody tr:last-child td { border-bottom:0; }
  /* 列宽按语义分级，禁止所有列一律同一个 max-width */
  .c-code { width:120px; font-variant-numeric:tabular-nums; }
  .c-narrow { width:88px; }
  /* 主体列：吸收表格剩余宽度，其余列保持定宽 */
  .c-mid { width:auto; }
  .c-wide { max-width:260px; }
  .c-num { width:96px; text-align:right; font-variant-numeric:tabular-nums; }
  .c-ops { width:150px; white-space:nowrap; }
  th.sortable { cursor:pointer; }
  th.sortable .dir { color:var(--text-3); margin-left:var(--sp-1); }
  .multi-select { position:relative; }
  .multi-select > .field { min-width:140px; text-align:left; cursor:pointer; }
  .multi-drop {
    display:none; position:absolute; z-index:20; top:calc(100% + var(--sp-1)); left:0;
    min-width:160px; padding:var(--sp-1); background:var(--bg-card); color:var(--text-1);
    border-radius:var(--radius); box-shadow:var(--shadow-2);
  }
  .multi-select.open .multi-drop { display:block; }
  .multi-drop label {
    display:flex; align-items:center; gap:var(--sp-2);
    padding:var(--sp-2) var(--sp-3); margin:0; color:var(--text-1);
  }
  .field-file { display:block; width:100%; margin-top:var(--sp-1); color:var(--text-2); }

  /* 状态胶囊 */
  .pill { display:inline-block; padding:var(--seg-gap) var(--sp-2); border-radius:var(--radius-pill); font-size:var(--fs-label); }
  .pill.ok { background:var(--success-soft); color:var(--success); }
  .pill.warn { background:var(--warning-soft); color:var(--warning); }
  .pill.muted { background:var(--muted-soft); color:var(--text-2); }

  .stat-row { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:var(--sp-3); max-width:var(--stat-max); }
  .stat-card {
    padding:var(--sp-4); background:var(--bg-card); border-radius:var(--radius); box-shadow:var(--shadow-1);
    transition:box-shadow var(--dur) var(--ease), transform var(--dur) var(--ease);
  }
  .stat-card:hover { box-shadow:var(--shadow-2); transform:translateY(-1px); }

  /* 空态 */
  .empty {
    padding:calc(var(--sp-6) * 2) var(--sp-6); text-align:center;
    background:var(--bg-card); border-radius:var(--radius); box-shadow:var(--shadow-1);
  }
  .empty-ico {
    width:var(--empty-ico); height:var(--empty-ico); display:block; margin:0 auto var(--sp-3);
    fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round;
    color:var(--text-3);
  }
  .empty h3 { margin:0 0 var(--sp-2); font-size:var(--fs-title); font-weight:600; color:var(--text-1); }
  .empty p { margin:0 0 var(--sp-4); color:var(--text-3); }

  /* 分页 */
  .pager { display:flex; align-items:center; gap:var(--sp-2); flex-wrap:wrap; margin-top:var(--sp-3); color:var(--text-3); font-size:var(--fs-label); }
  .pager .total { margin-right:auto; }
  .pager .page-btn {
    min-width:var(--ctl-sm); height:var(--ctl-sm); padding:0 var(--sp-2); border:0; border-radius:var(--radius-sm);
    background:transparent; color:var(--text-2); font-size:var(--fs-label);
    transition:background var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  .pager .page-btn:hover:not(:disabled) { background:var(--bg-hover); color:var(--text-1); }
  .pager .page-btn:disabled { color:var(--text-3); cursor:not-allowed; }
  .pager .page-btn.active { background:var(--color-primary-soft); color:var(--color-primary); font-weight:600; }

  /* 树+表范围条（按需）：标签与值同一行，靠左，超出换行，不均分 */
  .scope-bar {
    display:flex; flex-wrap:wrap; justify-content:flex-start; gap:var(--sp-3) var(--sp-6);
    margin-bottom:var(--sp-3); padding:var(--sp-3) var(--sp-4);
    background:var(--bg-card); border-radius:var(--radius); box-shadow:var(--shadow-1);
  }
  .scope-item {
    flex:0 0 auto; display:flex; align-items:baseline; gap:var(--sp-2);
  }
  .scope-bar .k { flex-shrink:0; color:var(--text-3); font-size:var(--fs-label); }
  .scope-bar .v { font-weight:600; white-space:nowrap; }

<script>
const USE_MOCK = true;
const THEME_KEY = 'admin-theme:会议室预约';
const AUTH_KEY = 'admin-auth:会议室预约';
const PAGE_SIZE = 10;

const MOCK = {
  currentUser: { name: '张伟', username: 'zhangwei', role: 'staff', roleLabel: '员工' },
  rooms: [
    { id: 1, name: '一号会议室', floor: '3F', capacity: 8, lastUsed: '2026-09-08' },
    { id: 2, name: '董事会会议室', floor: '5F', capacity: 20, lastUsed: '2026-09-01' }
  ]
};

let filterName = '';
let filterFrom = '';
let filterTo = '';
let filterFloors = [];
let sortKey = 'name';
let sortDir = 'asc';
let page = 1;
let pendingHash = '';
let nextId = 3;
let editingId = null;
let drawerMode = 'form';
let selectedIds = new Set();
let modalOnOk = null;
let pendingFileName = '';

const TAB_HOME = 'rooms';
const TAB_CRUMB = '会议室预约';
const TAB_META = {
  rooms: { title: '会议室一览', cache: true, closable: false },
  unknown: { title: '页面不存在', cache: false, closable: true }
};
// 每增一个叶子菜单：TAB_META 加一项。列表 cache true，表单 false。首页 TAB_HOME 不可关。

const $ = (sel) => document.querySelector(sel);
const shell = $('#shell');
const tabsEl = $('#tabs');
const tabPanes = $('#tabPanes');
const drawer = $('#drawer');
const toast = $('#toast');
const roleSel = $('#roleSel');
const roomForm = $('#roomForm');
const sidebar = $('#sidebar');
const breadcrumb = $('#breadcrumb');
let view = null;
let openTabs = [];
let activeTabKey = '';

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function isAuthed() {
  return sessionStorage.getItem(AUTH_KEY) === '1';
}

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 2500);
}

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem(THEME_KEY, theme);
  document.querySelectorAll('[data-theme-set]').forEach((btn) => {
    btn.classList.toggle('active', btn.getAttribute('data-theme-set') === theme);
  });
}

function emptyIcon() {
  return '<svg class="empty-ico" aria-hidden="true"><use href="#ico-empty"/></svg>';
}

function themeSegHtml() {
  const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  const btn = (theme, ico, label) =>
    '<button type="button" data-theme-set="' + theme + '" aria-label="' + label + '" title="' + label + '"'
    + (t === theme ? ' class="active"' : '')
    + '><svg class="theme-ico" aria-hidden="true"><use href="#' + ico + '"/></svg></button>';
  return '<div class="theme-seg">' + btn('light', 'ico-sun', '浅色') + btn('dark', 'ico-moon', '深色') + '</div>';
}

function loginSceneHtml() {
  return '<svg class="login-scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">'
    + '<defs><linearGradient id="loginSky" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0" stop-color="var(--login-sky-top)"/><stop offset="1" stop-color="var(--login-sky-bot)"/></linearGradient></defs>'
    + '<rect width="1600" height="900" fill="url(#loginSky)"/>'
    + '<circle cx="1180" cy="140" r="280" fill="var(--login-far)"/>'
    + '<circle cx="220" cy="640" r="210" fill="var(--login-build-3)"/>'
    + '<circle cx="1420" cy="560" r="170" fill="var(--login-build)"/>'
    + '<circle cx="780" cy="720" r="130" fill="var(--login-build-2)"/>'
    + '<circle cx="430" cy="180" r="90" fill="var(--login-build)"/>'
    + '<circle cx="980" cy="480" r="70" fill="var(--login-build-3)"/>'
    + '<circle cx="80" cy="280" r="48" fill="var(--login-far)"/>'
    + '<circle cx="1540" cy="220" r="36" fill="var(--login-build-2)"/>'
    + '<circle cx="620" cy="80" r="28" fill="var(--login-build-3)"/>'
    + '<circle cx="1320" cy="800" r="110" fill="var(--login-far)"/>'
    + '</svg>';
}

function loadTheme() {
  applyTheme(localStorage.getItem(THEME_KEY) === 'dark' ? 'dark' : 'light');
}

function applyRole(role) {
  document.body.setAttribute('data-role', role);
}

function setBreadcrumb(pageTitle) {
  breadcrumb.innerHTML = '会议室预约 / <strong>' + esc(pageTitle) + '</strong>';
}

function setActiveNav(route) {
  sidebar.querySelectorAll('a[data-route]').forEach((a) => {
    a.classList.toggle('active', a.getAttribute('data-route') === route);
  });
}

function tabKeyOf(r) {
  return r.name === 'unknown' ? 'unknown' : r.name;
}

function tabMetaOf(r) {
  return TAB_META[tabKeyOf(r)] || TAB_META.unknown;
}

function paneOf(key) {
  return [...tabPanes.children].find((p) => p.getAttribute('data-key') === key) || null;
}

function paintTabs() {
  if (!openTabs.length) {
    tabsEl.hidden = true;
    tabsEl.innerHTML = '';
    return;
  }
  tabsEl.hidden = false;
  tabsEl.innerHTML = openTabs.map((t) => {
    const close = t.closable
      ? '<button type="button" class="tab-close" data-close="' + esc(t.key) + '" aria-label="关闭' + esc(t.title) + '">×</button>'
      : '';
    return '<div class="tab' + (t.key === activeTabKey ? ' active' : '') + '">'
      + '<button type="button" class="tab-hit" data-tab="' + esc(t.key) + '">' + esc(t.title) + '</button>'
      + close + '</div>';
  }).join('');
}

function activatePane(key) {
  [...tabPanes.children].forEach((p) => p.classList.toggle('active', p.getAttribute('data-key') === key));
  view = paneOf(key);
}

function resetTabs() {
  openTabs = [];
  activeTabKey = '';
  tabPanes.innerHTML = '';
  paintTabs();
  view = null;
}

function beginPage(r, force) {
  shell.classList.remove('hidden');
  document.querySelectorAll('.login-wrap').forEach((el) => el.remove());
  const key = tabKeyOf(r);
  const meta = tabMetaOf(r);
  const existed = openTabs.some((t) => t.key === key);
  const sameTab = existed && activeTabKey === key;
  if (!existed) {
    openTabs.push({
      key: key,
      title: meta.title,
      cache: meta.cache,
      closable: meta.closable !== false && key !== TAB_HOME,
      hash: location.hash
    });
    const pane = document.createElement('main');
    pane.className = 'content tab-pane';
    pane.setAttribute('data-key', key);
    tabPanes.appendChild(pane);
  } else {
    const tab = openTabs.find((t) => t.key === key);
    tab.hash = location.hash;
    tab.title = meta.title;
  }
  const reuse = meta.cache && existed && !sameTab && !force && paneOf(key) && paneOf(key).dataset.ready === '1';
  activeTabKey = key;
  activatePane(key);
  paintTabs();
  setBreadcrumb(meta.title);
  setActiveNav(r.name === 'unknown' ? '' : r.name);
  return !reuse;
}

function closeTab(key) {
  const i = openTabs.findIndex((t) => t.key === key);
  if (i < 0 || !openTabs[i].closable) return;
  const wasActive = activeTabKey === key;
  const neighbor = openTabs[i + 1] || openTabs[i - 1];
  const pane = paneOf(key);
  if (pane) pane.remove();
  openTabs.splice(i, 1);
  if (wasActive && neighbor) navigate(neighbor.hash);
  else paintTabs();
}

function parseHash() {
  const raw = (location.hash || '#/rooms').replace(/^#/, '');
  const qi = raw.indexOf('?');
  const path = (qi < 0 ? raw : raw.slice(0, qi)).replace(/^\//, '');
  const params = new URLSearchParams(qi < 0 ? '' : raw.slice(qi + 1));
  return { path: path, params: params };
}

function roomsHash() {
  const p = new URLSearchParams();
  if (filterName) p.set('q', filterName);
  if (filterFrom) p.set('from', filterFrom);
  if (filterTo) p.set('to', filterTo);
  if (filterFloors.length) p.set('floors', filterFloors.join(','));
  if (sortKey !== 'name') p.set('sort', sortKey);
  if (sortDir !== 'asc') p.set('dir', sortDir);
  if (page > 1) p.set('page', String(page));
  const q = p.toString();
  return '#/rooms' + (q ? '?' + q : '');
}

function applyRoomsParams(params) {
  filterName = params.get('q') || '';
  filterFrom = params.get('from') || '';
  filterTo = params.get('to') || '';
  filterFloors = (params.get('floors') || '').split(',').filter(Boolean);
  sortKey = params.get('sort') || 'name';
  sortDir = params.get('dir') === 'desc' ? 'desc' : 'asc';
  page = Math.max(1, Number(params.get('page') || 1) || 1);
}

function getRoute() {
  return parseHash().path || 'rooms';
}

function navigate(hash) {
  if (location.hash !== hash) location.hash = hash;
  else route();
}

function filteredRooms() {
  const kw = filterName.trim();
  const rows = MOCK.rooms.filter((r) => {
    if (kw && !r.name.includes(kw)) return false;
    if (filterFrom && r.lastUsed < filterFrom) return false;
    if (filterTo && r.lastUsed > filterTo) return false;
    if (filterFloors.length && filterFloors.indexOf(r.floor) < 0) return false;
    return true;
  });
  const dir = sortDir === 'desc' ? -1 : 1;
  rows.sort((a, b) => {
    const av = a[sortKey];
    const bv = b[sortKey];
    if (typeof av === 'number' && typeof bv === 'number') return (av - bv) * dir;
    return String(av).localeCompare(String(bv), 'zh') * dir;
  });
  return rows;
}

function homeHash() {
  return '#/rooms';
}

function renderNotFound() {
  if (!beginPage({ name: 'unknown' }, true)) return;
  view.innerHTML = '<div class="empty">' + emptyIcon() + '<h3>页面不存在</h3><p>链接无效，或这个页面已经被移除。</p>'
    + '<button type="button" class="btn primary" id="btnHome">返回首页</button></div>';
  view.querySelector('#btnHome').addEventListener('click', () => navigate(homeHash()));
  view.dataset.ready = '1';
}

function paginate(list, cur, size) {
  const pages = Math.max(1, Math.ceil(list.length / size));
  const p = Math.min(Math.max(1, cur), pages);
  return { page: p, pages: pages, total: list.length, rows: list.slice((p - 1) * size, p * size) };
}

function pagerHtml(pg) {
  let nums = '';
  for (let i = 1; i <= pg.pages; i += 1) {
    nums += '<button type="button" class="page-btn' + (i === pg.page ? ' active' : '') + '" data-page="' + i + '">' + i + '</button>';
  }
  return '<div class="pager"><span class="total">共 ' + pg.total + ' 条</span>'
    + '<button type="button" class="page-btn" data-page="' + (pg.page - 1) + '"' + (pg.page <= 1 ? ' disabled' : '') + '>上一页</button>'
    + nums
    + '<button type="button" class="page-btn" data-page="' + (pg.page + 1) + '"' + (pg.page >= pg.pages ? ' disabled' : '') + '>下一页</button></div>';
}

function bindPager(root, rerender) {
  root.querySelectorAll('.page-btn[data-page]').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (btn.disabled) return;
      page = Number(btn.getAttribute('data-page'));
      navigate(roomsHash());
    });
  });
}

function setDrawerMode(mode) {
  drawerMode = mode;
  const showView = mode === 'view';
  roomForm.classList.toggle('hidden', showView);
  $('#drawerView').classList.toggle('hidden', !showView);
  $('#drawerViewActions').classList.toggle('hidden', !showView);
}

function fillView(r) {
  $('#drawerTitle').textContent = r.name;
  $('#drawerView').innerHTML = '<div class="desc-list">'
    + [['名称', r.name], ['楼层', r.floor], ['容量', r.capacity], ['最近使用', r.lastUsed], ['附件', r.attachment || '无']].map(([k, v]) =>
      '<div class="desc-row"><div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + '</div></div>').join('')
    + '</div>';
  $('#viewDel').setAttribute('data-del', String(r.id));
}

function fillForm(id) {
  editingId = id || null;
  $('#drawerTitle').textContent = id ? '编辑会议室' : '新建会议室';
  if (id) {
    const r = MOCK.rooms.find((x) => x.id === id);
    if (!r) return false;
    roomForm.elements.namedItem('name').value = r.name;
    roomForm.elements.namedItem('floor').value = r.floor;
    roomForm.elements.namedItem('capacity').value = String(r.capacity);
    pendingFileName = r.attachment || '';
  } else {
    roomForm.reset();
    pendingFileName = '';
  }
  return true;
}

function openDrawer(id, mode) {
  const next = mode || 'form';
  if (next === 'view') {
    const r = MOCK.rooms.find((x) => x.id === id);
    if (!r) return;
    editingId = id;
    fillView(r);
    setDrawerMode('view');
  } else {
    if (!fillForm(id)) return;
    setDrawerMode('form');
  }
  drawer.classList.add('open');
}

function closeDrawer() {
  drawer.classList.remove('open');
  editingId = null;
  setDrawerMode('form');
}

function openModal(opts) {
  $('#modalTitle').textContent = opts.title || '确认';
  $('#modalBody').textContent = opts.body || '';
  $('#modalOk').textContent = opts.okText || '确定';
  $('#modalOk').className = 'btn ' + (opts.danger ? 'danger' : 'primary');
  modalOnOk = opts.onOk || null;
  $('#modal').classList.add('open');
  $('#modalOk').focus();
}

function closeModal() {
  $('#modal').classList.remove('open');
  modalOnOk = null;
}

function confirmDelete(room, after) {
  openModal({
    title: '确认删除',
    body: '确定删除「' + room.name + '」？删除后列表将立刻更新。',
    danger: true,
    okText: '删除',
    onOk: () => {
      const idx = MOCK.rooms.findIndex((r) => r.id === room.id);
      if (idx >= 0) MOCK.rooms.splice(idx, 1);
      selectedIds.delete(room.id);
      closeModal();
      showToast('已删除');
      after();
    }
  });
}

function closeProfile() {
  $('#profileDrawer').classList.remove('open');
}

function syncUserChrome() {
  const u = MOCK.currentUser;
  $('#userName').textContent = u.name;
  $('#userAvatar').textContent = u.name.slice(0, 1);
}

function renderLogin() {
  resetTabs();
  document.querySelectorAll('.login-wrap').forEach((el) => el.remove());
  shell.classList.add('hidden');
  const wrap = document.createElement('div');
  wrap.className = 'login-wrap';
  wrap.innerHTML = themeSegHtml()
    + '<div class="login-brand"><span class="login-watermark" aria-hidden="true">会</span><div class="brand-mark">会</div><h1>会议室预约</h1><p>内部管理系统</p></div>'
    + '<div class="login-main">' + loginSceneHtml() + '<div class="login-card"><h2>欢迎回来</h2><form id="loginForm">'
    + '<label>账号<input type="text" class="field" name="user" required placeholder="任意账号" /></label>'
    + '<label>密码<input type="password" class="field" name="pwd" required placeholder="任意密码" /></label>'
    + '<button type="submit" class="btn primary">登录</button></form></div></div>';
  document.body.insertBefore(wrap, shell);
  wrap.querySelector('#loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    sessionStorage.setItem(AUTH_KEY, '1');
    const user = String(new FormData(e.target).get('user') || '').trim();
    if (user) MOCK.currentUser.username = user;
    syncUserChrome();
    wrap.remove();
    const target = pendingHash || '#/rooms';
    pendingHash = '';
    navigate(target);
  });
}

function syncBatchBar() {
  const bar = view && view.querySelector('#batchBar');
  if (!bar) return;
  bar.classList.toggle('open', selectedIds.size > 0);
  const count = bar.querySelector('#batchCount') || bar.querySelector('.count');
  if (count) count.textContent = '已选 ' + selectedIds.size + ' 项';
}

function renderRooms() {
  if (!beginPage({ name: 'rooms' })) return;
  syncUserChrome();

  const filtering = Boolean(filterName.trim() || filterFrom || filterTo || filterFloors.length);
  const pg = paginate(filteredRooms(), page, PAGE_SIZE);
  page = pg.page;
  const dirOf = (key) => (sortKey === key ? (sortDir === 'desc' ? ' ↓' : ' ↑') : '');
  const floors = Array.from(new Set(MOCK.rooms.map((r) => r.floor)));
  const floorLabel = filterFloors.length ? '楼层 ' + filterFloors.join('、') : '楼层';

  const body = pg.rows.length
    ? '<div class="table-wrap"><table><thead><tr>'
      + '<th class="c-check"><input type="checkbox" id="checkAll" /></th>'
      + '<th class="c-mid sortable" data-sort="name">名称<span class="dir">' + dirOf('name') + '</span></th>'
      + '<th class="c-narrow sortable" data-sort="floor">楼层<span class="dir">' + dirOf('floor') + '</span></th>'
      + '<th class="c-num sortable" data-sort="capacity">容量<span class="dir">' + dirOf('capacity') + '</span></th>'
      + '<th class="c-narrow sortable" data-sort="lastUsed">最近使用<span class="dir">' + dirOf('lastUsed') + '</span></th>'
      + '<th class="c-ops">操作</th>'
      + '</tr></thead><tbody>'
      + pg.rows.map((r) => '<tr>'
        + '<td class="c-check"><input type="checkbox" data-check="' + r.id + '"' + (selectedIds.has(r.id) ? ' checked' : '') + ' /></td>'
        + '<td class="c-mid">' + esc(r.name) + '</td>'
        + '<td class="c-narrow">' + esc(r.floor) + '</td>'
        + '<td class="c-num">' + esc(r.capacity) + '</td>'
        + '<td class="c-narrow">' + esc(r.lastUsed) + '</td>'
        + '<td class="c-ops">'
        + '<button type="button" class="btn-link" data-view="' + r.id + '">查看</button>'
        + '<button type="button" class="btn-link" data-edit="' + r.id + '">编辑</button>'
        + '<button type="button" class="btn-link danger role-admin-only" data-del="' + r.id + '">删除</button></td>'
        + '</tr>').join('')
      + '</tbody></table></div>' + pagerHtml(pg)
    : (filtering
      ? '<div class="empty">' + emptyIcon() + '<h3>没有匹配结果</h3><p>试着换个关键字或日期，或重置筛选条件。</p><button type="button" class="btn ghost" id="btnReset2">重置筛选</button></div>'
      : '<div class="empty">' + emptyIcon() + '<h3>还没有会议室</h3><p>创建第一间会议室后，这里会显示它的楼层与容量。</p><button type="button" class="btn primary" id="btnNew2">新建会议室</button></div>');

  view.innerHTML = '<div class="filter-bar"><label>名称 <input type="text" class="field" id="filterName" value="' + esc(filterName) + '" placeholder="关键字" /></label>'
    + '<div class="multi-select" id="floorMulti"><button type="button" class="field" id="floorBtn">' + esc(floorLabel) + '</button>'
    + '<div class="multi-drop">' + floors.map((f) => '<label><input type="checkbox" value="' + esc(f) + '"' + (filterFloors.indexOf(f) >= 0 ? ' checked' : '') + ' /> ' + esc(f) + '</label>').join('') + '</div></div>'
    + '<span class="date-range"><span>最近使用</span>'
    + '<input type="date" class="field" id="filterFrom" value="' + esc(filterFrom) + '" />'
    + '<span class="sep">至</span>'
    + '<input type="date" class="field" id="filterTo" value="' + esc(filterTo) + '" /></span>'
    + '<button type="button" class="btn primary" id="btnSearch">查询</button>'
    + '<button type="button" class="btn ghost" id="btnReset">重置</button>'
    + '<button type="button" class="btn primary" id="btnNew">新建</button></div>'
    + '<div class="batch-bar' + (selectedIds.size ? ' open' : '') + '" id="batchBar"><span class="count" id="batchCount">已选 ' + selectedIds.size + ' 项</span>'
    + '<button type="button" class="btn ghost role-admin-only" id="btnBatchDel">批量删除</button></div>'
    + body;

  const $v = (sel) => view.querySelector(sel);
  $v('#btnNew').addEventListener('click', openDrawer);
  const btnNew2 = $v('#btnNew2');
  if (btnNew2) btnNew2.addEventListener('click', openDrawer);
  $v('#filterName').addEventListener('input', (e) => { filterName = e.target.value; });
  $v('#filterFrom').addEventListener('change', (e) => { filterFrom = e.target.value; });
  $v('#filterTo').addEventListener('change', (e) => { filterTo = e.target.value; });
  $v('#btnSearch').addEventListener('click', () => { page = 1; navigate(roomsHash()); });
  const doReset = () => { filterName = ''; filterFrom = ''; filterTo = ''; filterFloors = []; sortKey = 'name'; sortDir = 'asc'; page = 1; selectedIds = new Set(); navigate('#/rooms'); };
  $v('#btnReset').addEventListener('click', doReset);
  const btnReset2 = $v('#btnReset2');
  if (btnReset2) btnReset2.addEventListener('click', doReset);
  view.querySelectorAll('th.sortable').forEach((th) => {
    th.addEventListener('click', () => {
      const key = th.getAttribute('data-sort');
      if (sortKey === key) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      else { sortKey = key; sortDir = 'asc'; }
      navigate(roomsHash());
    });
  });
  const floorBtn = $v('#floorBtn');
  const floorMulti = $v('#floorMulti');
  if (floorBtn && floorMulti) {
    floorBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      floorMulti.classList.toggle('open');
    });
    floorMulti.querySelector('.multi-drop').addEventListener('click', (e) => e.stopPropagation());
    floorMulti.querySelectorAll('input[type="checkbox"]').forEach((box) => {
      box.addEventListener('change', () => {
        filterFloors = [...floorMulti.querySelectorAll('input:checked')].map((x) => x.value);
      });
    });
  }
  bindPager(view, renderRooms);
  view.querySelectorAll('[data-view]').forEach((btn) => {
    btn.addEventListener('click', () => openDrawer(Number(btn.getAttribute('data-view')), 'view'));
  });
  view.querySelectorAll('[data-edit]').forEach((btn) => {
    btn.addEventListener('click', () => openDrawer(Number(btn.getAttribute('data-edit')), 'form'));
  });
  view.querySelectorAll('[data-del]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const id = Number(btn.getAttribute('data-del'));
      const room = MOCK.rooms.find((r) => r.id === id);
      if (!room) return;
      confirmDelete(room, () => { closeDrawer(); navigate(roomsHash()); });
    });
  });
  view.querySelectorAll('[data-check]').forEach((box) => {
    box.addEventListener('change', () => {
      const id = Number(box.getAttribute('data-check'));
      if (box.checked) selectedIds.add(id);
      else selectedIds.delete(id);
      syncBatchBar();
    });
  });
  const checkAll = $v('#checkAll');
  if (checkAll) {
    checkAll.addEventListener('change', () => {
      pg.rows.forEach((r) => {
        if (checkAll.checked) selectedIds.add(r.id);
        else selectedIds.delete(r.id);
      });
      navigate(roomsHash());
    });
  }
  const btnBatch = $v('#btnBatchDel');
  if (btnBatch) {
    btnBatch.addEventListener('click', () => {
      if (!selectedIds.size) return;
      const n = selectedIds.size;
      openModal({
        title: '批量删除',
        body: '确定删除已选的 ' + n + ' 间会议室？',
        danger: true,
        okText: '删除',
        onOk: () => {
          MOCK.rooms = MOCK.rooms.filter((r) => !selectedIds.has(r.id));
          selectedIds = new Set();
          closeModal();
          showToast('已删除 ' + n + ' 间');
          navigate(roomsHash());
        }
      });
    });
  }
  view.dataset.ready = '1';
}

function closeUserMenu() {
  $('#userDropdown').classList.remove('open');
  $('#userMenuBtn').setAttribute('aria-expanded', 'false');
}

function openProfile() {
  closeUserMenu();
  const u = MOCK.currentUser;
  const rows = [
    ['姓名', u.name],
    ['账号', u.username],
    ['角色', u.roleLabel]
  ].map(([k, v]) => '<div class="desc-row"><div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + '</div></div>').join('');
  $('#profileView').innerHTML = '<div class="desc-list">' + rows + '</div>';
  $('#profileDrawer').classList.add('open');
}

function logout() {
  closeUserMenu();
  closeModal();
  closeProfile();
  closeDrawer();
  resetTabs();
  sessionStorage.removeItem(AUTH_KEY);
  pendingHash = '';
  navigate('#/login');
}

function route() {
  const { path, params } = parseHash();
  if (path === 'login') { renderLogin(); return; }
  if (!isAuthed()) {
    pendingHash = location.hash || '#/rooms';
    if (location.hash !== '#/login') location.hash = '#/login';
    else renderLogin();
    return;
  }
  if (path === 'rooms' || path === '') {
    applyRoomsParams(params);
    renderRooms();
    return;
  }
  renderNotFound();
}

roleSel.addEventListener('change', () => applyRole(roleSel.value));
$('#userMenuBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  const open = !$('#userDropdown').classList.contains('open');
  $('#userDropdown').classList.toggle('open', open);
  $('#userMenuBtn').setAttribute('aria-expanded', open ? 'true' : 'false');
});
$('#userDropdown').addEventListener('click', (e) => e.stopPropagation());
$('#btnProfile').addEventListener('click', openProfile);
$('#btnLogout').addEventListener('click', logout);
$('#profileClose').addEventListener('click', closeProfile);
$('#modalCancel').addEventListener('click', closeModal);
$('#modalOk').addEventListener('click', () => { if (modalOnOk) modalOnOk(); });
document.addEventListener('click', (e) => {
  const themeBtn = e.target.closest('[data-theme-set]');
  if (themeBtn) applyTheme(themeBtn.getAttribute('data-theme-set'));
  if (!e.target.closest('.multi-select')) {
    document.querySelectorAll('.multi-select.open').forEach((el) => el.classList.remove('open'));
  }
  closeUserMenu();
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') {
    if (e.key !== 'Tab' || !$('#modal').classList.contains('open')) return;
    const focusable = [...$('#modal').querySelectorAll('button')];
    if (!focusable.length) return;
    const i = focusable.indexOf(document.activeElement);
    if (e.shiftKey && i <= 0) { e.preventDefault(); focusable[focusable.length - 1].focus(); }
    else if (!e.shiftKey && i === focusable.length - 1) { e.preventDefault(); focusable[0].focus(); }
    return;
  }
  if ($('#userDropdown').classList.contains('open')) { closeUserMenu(); return; }
  if ($('#modal').classList.contains('open')) { closeModal(); return; }
  if ($('#profileDrawer').classList.contains('open')) { closeProfile(); return; }
  if (drawer.classList.contains('open')) closeDrawer();
});
$('#sidebarToggle').addEventListener('click', () => sidebar.classList.toggle('collapsed'));
tabsEl.addEventListener('click', (e) => {
  const closer = e.target.closest('[data-close]');
  if (closer) {
    e.preventDefault();
    closeTab(closer.getAttribute('data-close'));
    return;
  }
  const hit = e.target.closest('[data-tab]');
  if (!hit) return;
  const tab = openTabs.find((t) => t.key === hit.getAttribute('data-tab'));
  if (tab) navigate(tab.hash);
});
$('#navBizToggle').addEventListener('click', () => $('#navBiz').classList.toggle('collapsed'));
$('#navScreenToggle').addEventListener('click', () => $('#navScreen').classList.toggle('collapsed'));
$('#drawerCancel').addEventListener('click', closeDrawer);
$('#viewClose').addEventListener('click', closeDrawer);
$('#viewEdit').addEventListener('click', () => { if (editingId) openDrawer(editingId, 'form'); });
roomForm.elements.namedItem('file').addEventListener('change', (e) => {
  const f = e.target.files && e.target.files[0];
  pendingFileName = f ? f.name : '';
  if (pendingFileName) showToast('已选择 ' + pendingFileName);
});
$('#viewDel').addEventListener('click', () => {
  const id = Number($('#viewDel').getAttribute('data-del'));
  const room = MOCK.rooms.find((r) => r.id === id);
  if (!room) return;
  confirmDelete(room, () => { closeDrawer(); navigate(roomsHash()); });
});

roomForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const fd = new FormData(roomForm);
  const name = String(fd.get('name') || '').trim();
  const floor = String(fd.get('floor') || '').trim();
  const capacity = Number(fd.get('capacity'));
  if (!name || !floor || !capacity) {
    showToast('请填写完整信息');
    return;
  }
  const btn = roomForm.querySelector('[type="submit"]');
  btn.classList.add('is-loading');
  btn.disabled = true;
  const today = '2026-09-09';
  window.setTimeout(() => {
    btn.classList.remove('is-loading');
    btn.disabled = false;
    if (editingId) {
      const room = MOCK.rooms.find((r) => r.id === editingId);
      if (!room) return;
      room.name = name; room.floor = floor; room.capacity = capacity;
      if (pendingFileName) room.attachment = pendingFileName;
      closeDrawer();
      showToast('保存成功');
    } else {
      MOCK.rooms.push({ id: nextId++, name: name, floor: floor, capacity: capacity, lastUsed: today, attachment: pendingFileName || '' });
      page = 1;
      closeDrawer();
      showToast('新建成功');
    }
    if (getRoute() === 'rooms') navigate(roomsHash());
  }, 280);
});

window.addEventListener('hashchange', route);

loadTheme();
applyRole(roleSel.value);
syncUserChrome();
if (!location.hash) location.hash = '#/rooms';
else route();
</script>
</body>
</html>
